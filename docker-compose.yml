# SÂN — dev stack. One modular monolith on one Postgres (see docs/09).
#   app (php-fpm) · web (nginx) · db (postgres 16) · redis · horizon · scheduler · vite

services:
  app:
    build: { context: ./apps/app, dockerfile: docker/php/Dockerfile }
    restart: unless-stopped
    environment:
      # Blade updates compiled-template mtimes; keep that cache off host bind mounts.
      VIEW_COMPILED_PATH: /tmp/san-blade
    volumes:
      - ./apps/app:/var/www
      - ./apps/app/docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on: [db, redis]
    networks: [san]

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["8000:80"]
    volumes:
      - ./apps/app:/var/www
      - ./apps/app/docker/nginx:/etc/nginx/conf.d:ro
    depends_on: [app]
    networks: [san]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-san}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports: ["127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [san]

  redis:
    image: redis:alpine
    restart: unless-stopped
    # ports chỉ dùng nếu muốn expose ra host; internal containers dùng network
    # ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    networks: [san]

  # Queue via Horizon (reminders, ZNS, reconcile, series generation).
  horizon:
    build: { context: ./apps/app, dockerfile: docker/php/Dockerfile }
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./apps/app:/var/www
      - ./apps/app/docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on: [db, redis]
    networks: [san]

  # Scheduler — ExpireStaleHolds (1'), GenerateSeriesOccurrences (daily), SendBookingReminders.
  scheduler:
    build: { context: ./apps/app, dockerfile: docker/php/Dockerfile }
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./apps/app:/var/www
      - ./apps/app/docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on: [db, redis]
    networks: [san]

  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www
    volumes: [./apps/app:/var/www]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks: [san]

networks:
  san: { driver: bridge }

volumes:
  db-data:
  redis-data:
